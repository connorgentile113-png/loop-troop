<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Loop Troop — Eaglercraft</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e20;color:white;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#banner{position:fixed;inset:0;z-index:2;display:grid;place-content:center;text-align:center;background:#090e20}
h1{font-size:clamp(42px,8vw,88px);margin:0;color:#b8ff69}p{color:#b7c4df}button{position:fixed;right:12px;top:12px;z-index:1;padding:8px 12px;border:1px solid #ffffff55;border-radius:8px;background:#090e20cc;color:white;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="banner" role="status"><h1>🌀 Loop Troop</h1><p>Your next adventure starts here.</p></div>
<iframe id="game" title="Eaglercraft — choose a server" allow="fullscreen; pointer-lock; autoplay; gamepad" allowfullscreen hidden></iframe>
<button id="fullscreen" hidden>Fullscreen</button>
<noscript>Enable JavaScript to start Eaglercraft.</noscript>
<script>
const frame = document.getElementById('game');
const fullscreen = document.getElementById('fullscreen');
setTimeout(() => {
  let name = '';
  try { name = localStorage.getItem('loop-troop-edu-name') || ''; } catch {}
  frame.src = '/mc/eaglercraft?name=' + encodeURIComponent(name);
  frame.hidden = false;
  document.getElementById('banner').hidden = true;
  fullscreen.hidden = false;
  frame.focus();
}, 3000);
fullscreen.addEventListener('click', () => {
  document.documentElement.requestFullscreen?.().catch(() => {});
  frame.focus();
});
</script>
</body>
</html>
